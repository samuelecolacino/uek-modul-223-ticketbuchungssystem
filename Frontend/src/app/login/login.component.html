<div class="login-shell">
  <mat-card appearance="outlined" class="login-card">
    <mat-card-header>
      <mat-card-title>TicketShop</mat-card-title>
      <mat-card-subtitle>Bitte anmelden, um Tickets zu kaufen.</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <mat-form-field appearance="outline">
          <mat-label>Benutzername</mat-label>
          <input matInput formControlName="username" autocomplete="username" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Passwort</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
        </mat-form-field>

        @if (error()) {
          <p class="error" role="alert">
            <mat-icon aria-hidden="true">error_outline</mat-icon>
            <span>{{ error() }}</span>
          </p>
        }

        <button
          mat-flat-button
          color="primary"
          type="submit"
          [disabled]="form.invalid || loading()">
          @if (loading()) {
            <mat-progress-spinner mode="indeterminate" diameter="20" />
          } @else {
            <span>Anmelden</span>
          }
        </button>
      </form>
    </mat-card-content>

    <mat-card-footer>
      <p class="hint">Test-Konten: <code>admin / admin</code> · <code>user / user</code></p>
    </mat-card-footer>
  </mat-card>
</div>
